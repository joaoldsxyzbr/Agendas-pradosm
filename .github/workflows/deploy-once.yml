name: Deploy Once

on:
  push:
    branches:
      - feat/agenda-prado-v1-clean
    paths:
      - ".github/workflows/deploy-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Ensure session secret exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler secret list --format json | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const items = JSON.parse(raw);
              process.exit(items.some(item => item.name === "SESSION_SECRET") ? 0 : 1);
            });
          '; then
            echo "SESSION_SECRET already configured."
          else
            node -e 'const crypto=require("node:crypto"); console.log(JSON.stringify({SESSION_SECRET: crypto.randomBytes(32).toString("hex")}));' |
              npx wrangler secret bulk
            echo "SESSION_SECRET configured."
          fi

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply agendas-prado --remote

      - name: Check active administrator
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute agendas-prado --remote --command "SELECT COUNT(*) AS total FROM usuarios WHERE perfil = 'admin' AND ativo = 1;" --json > /tmp/admin-count.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("/tmp/admin-count.json", "utf8"));
            const entries = Array.isArray(data) ? data : [data];
            const rows = entries.flatMap(entry => entry.results ?? []);
            const total = Number(rows[0]?.total ?? 0);
            console.log("ACTIVE_ADMIN_COUNT=" + total);
            if (total < 1) {
              console.log("::warning::No active administrator exists yet.");
            }
          '

      - name: Deploy Worker
        run: npm run deploy
