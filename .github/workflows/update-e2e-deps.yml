name: Update E2E dependencies

on:
  push:
    branches:
      - fix/frontend-e2e-hardening
    paths:
      - ".github/workflows/update-e2e-deps.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/frontend-e2e-hardening

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Update package metadata
        run: npm install --save-dev --save-exact @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: add Playwright and axe dependencies"
          git push
