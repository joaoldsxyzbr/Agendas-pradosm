name: Task 11 Deploy

on:
  push:
    branches:
      - feat/agenda-prado-v1-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply agendas-prado --remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Configure SESSION_SECRET
        shell: bash
        run: |
          secret="$(openssl rand -hex 48)"
          printf '%s' "$secret" | npx wrangler secret put SESSION_SECRET
