name: Task 11 Verify and Deploy

on:
  push:
    branches:
      - feat/agenda-prado-v1-clean
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply agendas-prado --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Publish Task 11 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then
            state="error"
          fi
          gh api --method POST             "repos/${{ github.repository }}/statuses/${{ github.sha }}"             -f state="$state"             -f context="agenda-prado/task11"             -f description="Task 11 verify + deploy: $JOB_STATUS"
