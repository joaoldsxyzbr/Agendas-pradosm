name: CodeQL Scheduled

on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript
          queries: security-extended

      - name: Analyze without Code Scanning upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results

      - name: Require no CodeQL findings
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          test "${#files[@]}" -gt 0
          jq -e '[.[].runs[]?.results[]?] | length == 0' --slurp "${files[@]}"
