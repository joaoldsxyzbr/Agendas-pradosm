# Temporario: gera o lockfile via npm oficial no runner Linux.
# Remover depois de sincronizar o package-lock.json na preview.
name: Tailwind lockfile preview
on:
  push:
    branches: [preview]
    paths:
      - package.json
      - .github/workflows/tailwind-lock-preview.yml
permissions:
  contents: write
concurrency:
  group: tailwind-lock-preview
  cancel-in-progress: false
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Regenerar lockfile em ambiente isolado
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Gravar somente o lockfile na preview
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(preview): lock Tailwind CSS v4 dependencies'
          git push origin HEAD:preview
