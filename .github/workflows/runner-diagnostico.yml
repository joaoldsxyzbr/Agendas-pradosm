name: Diagnóstico operacional (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    name: Gerar diff de lockfile (temporario nesta branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Regenerar lock sem instalar nem executar scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --save-dev --save-exact wrangler@4.151.2
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            const before = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], { encoding: "utf8" }));
            const after = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const changed = {};
            for (const [name, value] of Object.entries(after.packages))
              if (JSON.stringify(value) !== JSON.stringify(before.packages[name])) changed[name] = value;
            const removed = Object.keys(before.packages).filter(name => !Object.hasOwn(after.packages, name));
            const json = JSON.stringify({ changed, removed });
            const size = 1000;
            const parts = Math.ceil(json.length / size);
            for (let i = 0; i < parts; i++)
              console.log(`GHDELTA|${i}|${parts}|${json.slice(i * size, (i + 1) * size)}`);
            console.log("Versao Wrangler gerada: " + after.packages["node_modules/wrangler"].version);
            console.log("Versao Miniflare gerada: " + after.packages["node_modules/miniflare"].version);
            console.log("Versao sharp gerada: " + after.packages["node_modules/sharp"].version);
          '
          npm audit --audit-level=high
