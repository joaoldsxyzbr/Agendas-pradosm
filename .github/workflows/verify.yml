name: Manual Verify
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  manual-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Validacao manual da producao JS
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          npm audit --omit=dev
          npm run verify:production
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Publicar status aprovado
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="success" \
            -f context="agenda-prado/manual-verify" \
            -f description="JS puro, testes, build e Worker aprovados"
