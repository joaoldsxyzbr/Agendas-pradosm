name: Finalizar migracao JS puro (sem deploy)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/migracao-js-puro'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Remover TypeScript React e Vite do candidato
        run: node scripts/finalize-js-migration.mjs
      - name: Atualizar lockfile sem dependencias antigas
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Validar instalacao reproduzivel
        run: npm ci --legacy-peer-deps
      - name: Validar 100 por cento JS, contratos e frontend
        run: |
          npm test
          npm run test:design
          npm run test:bootstrap-admin
          npm run check:migrations
          npm run build
          node scripts/check-migracao-build.mjs
      - name: Empacotar Worker de producao sem publicar
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Verificar que nao existem fontes TS nem dependencias React
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find src shared worker tests -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' \) -print)"
          node -e 'const p=require("./package.json"); const d={...p.dependencies,...p.devDependencies}; for (const name of ["react","react-dom","react-router-dom","vite","vitest","typescript"]) if (d[name]) process.exit(1)'
          grep -q '"main": "./worker/index.js"' wrangler.jsonc
          grep -q '"directory": "./dist"' wrangler.jsonc
          echo CLEANUP_OK
      - name: Registrar finalizacao na branch de migracao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao a registrar."
            exit 0
          fi
          git commit -m "refactor(migracao): concluir JS puro sem React Vite ou TypeScript"
          git push origin HEAD:migracao-js-puro
