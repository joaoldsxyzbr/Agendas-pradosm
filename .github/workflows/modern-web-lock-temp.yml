name: Bootstrap lockfile React (temporario)
on:
  push:
    branches: [modernizacao-react-vite]
    paths:
      - apps/web/package.json
      - .github/workflows/modern-web-lock-temp.yml
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Gerar lockfile reproduzivel sem scripts de instalacao
        run: npm install --prefix apps/web --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit apenas do lockfile na branch de migracao
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(modern): gerar lockfile npm isolado'
          git push origin HEAD:modernizacao-react-vite
