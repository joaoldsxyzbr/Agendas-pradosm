name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  bootstrap:
    name: Migration bootstrap
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(preview): migration bootstrap' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview migration bootstrap; full validation runs after finalization."

  quality:
    name: Tests, typecheck, build and E2E
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'chore(preview): migration bootstrap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate JavaScript, HTML and CSS preview
        run: |
          node --check public/vanilla/app.js
          node --check public/vanilla/live.js
          test -s public/vanilla/live.html
          test -s public/vanilla/index.html
          test -s public/vanilla/styles.css

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_PREVIEW_MOCKS: "off"
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility
        env:
          SESSION_SECRET: agenda-prado-ci-e2e-secret
        run: npm run test:e2e:ci

  codeql:
    name: CodeQL JavaScript/TypeScript
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'chore(preview): migration bootstrap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze without Code Scanning upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results

      - name: Require no CodeQL findings
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          test "${#files[@]}" -gt 0
          jq --slurp '[.[].runs[]?.results[]? | {ruleId, message: .message.text, locations: .locations}]' "${files[@]}"
          jq -e '[.[].runs[]?.results[]?] | length == 0' --slurp "${files[@]}"

  verify:
    name: verify
    if: ${{ always() && (github.event_name != 'push' || github.event.head_commit.message != 'chore(preview): migration bootstrap') }}
    needs: [quality, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and CodeQL
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"

