name: CI

on:
  push:
    branches: [main, testes, preview]
  pull_request:
    branches: [main, testes, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-js-puro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JavaScript, seguranca, build e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Dependencias reproduziveis
        run: npm ci --legacy-peer-deps
      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev
      - name: Bloquear vulnerabilidades altas e criticas nas dependencias de desenvolvimento
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps/web --audit-level=high
      - name: Garantir isolamento da UI React e do Worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-modern-boundary.mjs
          node -e 'const p=require("./package.json");const d={...p.dependencies,...p.devDependencies};for(const n of ["react","react-dom","react-router-dom","vite","vitest","typescript"])if(d[n])process.exit(1)'
          node scripts/check-worker.mjs
          node scripts/check-frontend.mjs
      - name: Validar migrations e Worker
        run: npm run check:migrations
      - name: Testes JavaScript e design
        run: |
          npm test
          npm run test:design
          npm run test:bootstrap-admin
      - name: Build nativo e integridade dos assets
        run: |
          npm run build
          node scripts/check-build.mjs
          node scripts/build-modern-preview.mjs
      - name: Dry-run do Worker de producao sem deploy
        run: npx wrangler deploy --dry-run --config wrangler.preview.jsonc
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Preparar D1 local para testes de integracao
        run: node scripts/prepare-e2e.mjs
      - name: Testes de navegador sem dados reais
        env:
          CI: "true"
        run: npm run test:e2e
      - name: E2E React isolado com dados sinteticos
        env:
          CI: "true"
        run: npx playwright test --config apps/web/playwright.config.mjs
      - name: Guardar diagnosticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-js-puro
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analisar JS sem enviar para Code Scanning
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results
      - name: Bloquear findings de seguranca
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          test "${#files[@]}" -gt 0
          jq -r '[.[].runs[]?.results[]? | {rule: .ruleId, file: (.locations[0].physicalLocation.artifactLocation.uri // ""), message: (.message.text // "")}]' --slurp "${files[@]}"
          jq -e '[.[].runs[]?.results[]?] | length == 0' --slurp "${files[@]}"

  verify:
    name: verify
    if: always()
    needs: [quality, codeql]
    runs-on: ubuntu-24.04
    steps:
      - name: Exigir qualidade e seguranca verdes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"