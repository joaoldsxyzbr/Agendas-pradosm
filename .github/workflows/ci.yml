name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  quality:
    name: Tests, typecheck, build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate JavaScript, HTML and CSS preview
        run: |
          node --check public/vanilla/app.js
          node --check public/vanilla/live.js
          test -s public/vanilla/live.html
          test -s public/vanilla/index.html
          test -s public/vanilla/styles.css

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_PREVIEW_MOCKS: "off"
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility
        env:
          SESSION_SECRET: agenda-prado-ci-e2e-secret
        run: npm run test:e2e:ci

  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze without Code Scanning upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results

      - name: Require no CodeQL findings
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          test "${#files[@]}" -gt 0
          jq --slurp '[.[].runs[]?.results[]? | {ruleId, message: .message.text, locations: .locations}]' "${files[@]}"
          jq -e '[.[].runs[]?.results[]?] | length == 0' --slurp "${files[@]}"

  verify:
    name: verify
    if: always()
    needs: [quality, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and CodeQL
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"

  convert-preview-sources:
    name: Convert worker modules to JavaScript (preview only)
    if: github.ref == 'refs/heads/preview' && github.event_name == 'push'
    needs: [verify]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Convert to JavaScript
        run: node scripts/convert-worker-preview.mjs
      - name: Validate generated JavaScript
        run: |
          find worker shared -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check public/vanilla/parseAgendaBatch.js
          node --check public/vanilla/parseAgendaText.js
          node --check public/vanilla/exportAgendaPdf.js
      - name: Commit to preview without creating branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker shared public/vanilla
          if ! git diff --cached --quiet; then
            git commit -m "refactor(preview): gerar fontes JavaScript do Worker e utilitários"
            git push origin HEAD:preview
          fi
