name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  quality:
    name: Tests, JavaScript checks, build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Validate HTML, CSS and JavaScript
        run: |
          node scripts/check-javascript.mjs
          test -s public/index.html
          test -s public/vanilla/live.js
          test -s public/vanilla/styles.css

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test
        run: npm test

      - name: Check JavaScript
        run: npm run check:javascript

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility
        env:
          SESSION_SECRET: agenda-prado-ci-e2e-secret
        run: npm run test:e2e:ci

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript
          queries: security-extended

      - name: Analyze without Code Scanning upload
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          upload: never
          output: codeql-results

      - name: Require no CodeQL findings
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          test "${#files[@]}" -gt 0
          jq --slurp '[.[].runs[]?.results[]? | {ruleId, message: .message.text, locations: .locations}]' "${files[@]}"
          jq -e '[.[].runs[]?.results[]?] | length == 0' --slurp "${files[@]}"

  verify:
    name: verify
    if: always()
    needs: [quality, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and CodeQL
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"

