name: Convert Worker to JavaScript (Preview)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-worker-source-migration
  cancel-in-progress: false

jobs:
  convert:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate JavaScript modules
        run: node scripts/convert-worker-preview.mjs
      - name: Confirm JavaScript source syntax
        run: find worker shared -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit conversion only on preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker shared
          if ! git diff --cached --quiet; then
            git commit -m "refactor(preview): gerar módulos Worker em JavaScript"
            git push origin HEAD:preview
          fi
