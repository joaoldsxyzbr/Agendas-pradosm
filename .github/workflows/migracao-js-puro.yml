name: CI - Migracao JavaScript puro

on:
  push:
    branches:
      - migracao-js-puro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migracao-js-puro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: 1 - Verificar executor GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Runner iniciou
        shell: bash
        run: |
          set -euo pipefail
          echo "CI_RUNNER_OK"
          echo "Sistema: $(uname -s)"
          echo "Arquitetura: $(uname -m)"

  codigo:
    name: 2 - Validar backend, frontend e build JS
    needs: runner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Verificar modulos nativos e APIs
        run: |
          node scripts/check-migracao-worker.mjs
          node scripts/check-migracao-frontend.mjs

      - name: Executar testes JavaScript
        run: npm test

      - name: Gerar HTML CSS e JavaScript puro
        run: npm run build

      - name: Validar os arquivos publicados, PDF e CSP
        run: node scripts/check-migracao-build.mjs

      - name: Conferir protecao do banco e deploy
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(!p.scripts["deploy"].includes("block-migration-deploy") || !p.scripts["deploy:cloudflare"].includes("block-migration-deploy")) process.exit(1)'
          grep -q '"main": "./worker/index.js"' wrangler.migracao.jsonc
          grep -q '"REALTIME_MODE": "off"' wrangler.migracao.jsonc
          echo "Produção permanece isolada."

  navegador:
    name: 3 - Validar fluxos reais com APIs mockadas
    needs: codigo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testar login, perfis, conferente e importacao
        run: npm run migracao:e2e

      - name: Guardar diagnosticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-migracao-js
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
