name: Dependency Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/dev-dependency-audit-2026-09-30'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Refresh vulnerable Cloudflare dev dependencies
        run: npm install --save-dev @cloudflare/vite-plugin@1.62.2 @cloudflare/vitest-plugin@1.3.3 wrangler@4.144.0 @cloudflare/workers-types@5.20260930.2

      - name: Audit all dependencies
        run: npm audit

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps-dev): update Cloudflare toolchain"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
